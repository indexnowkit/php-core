# CI of the read-only split repository indexnowkit/php-core. Development happens in
# https://github.com/indexnowkit/php (monorepo), whose CI also covers the Doctrine and Symfony packages.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: intl, xmlreader, zlib
          coverage: none
      - run: composer update --no-interaction --prefer-dist
      - run: vendor/bin/phpunit
      - run: vendor/bin/phpstan analyse src --level 9 --memory-limit=1G
